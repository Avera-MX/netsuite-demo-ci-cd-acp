changelog:
  exclude:
    labels:
      - ignore-for-release
      - ci
      - dependencies
      - internal
    authors:
      - octocat
      - dependabot
  categories:
    - title: ⚠️ Breaking Changes
      labels:
        - semver-major
        - breaking-change
    - title: 🎉 New Features
      labels:
        - semver-minor
        - enhancement
        - feature
    - title: 🐛 Bug Fixes
      labels:
        - bug
        - fix
    - title: ⚡ Performance Improvements
      labels:
        - performance
        - optimization
    - title: 📝 Documentation Updates
      labels:
        - documentation
        - docs
    - title: 🛠️ Maintenance & Other Changes
      labels:
        - maintenance
        - refactor
        - "*"
